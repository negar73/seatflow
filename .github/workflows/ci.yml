name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      # `npm run typecheck` runs `next typegen` first so the generated route
      # types exist before `tsc --noEmit` validates the whole codebase.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
